<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artale羅密歐與茱麗葉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-top">
          <h1>Artale羅密歐與茱麗葉</h1>
          <button id="themeToggleBtn" class="btn-secondary" type="button" aria-label="切換深色模式" title="切換深色模式">🌙</button>
        </div>
      </header>

      <section class="panel setup" aria-label="房間設定">
        <div class="field-grid">
          <label class="field">
            <span>房號</span>
            <div class="room-code-row">
              <input id="roomInput" type="text" maxlength="48" placeholder="請先按創建房間" readonly />
              <button id="copyRoomBtn" class="btn-secondary room-copy-btn" type="button" aria-label="複製房號" title="複製房號">⧉</button>
            </div>
          </label>
          <label class="field">
            <span>玩家名稱</span>
            <input id="nameInput" type="text" maxlength="20" placeholder="輸入你的名稱" />
          </label>
        </div>

        <div class="actions">
          <button id="generateRoomBtn" class="btn-secondary" type="button">創建房間</button>
        </div>

        <div class="seat-picker" id="seatPicker" aria-label="座位選擇"></div>

        <div class="actions">
          <button id="joinBtn" class="btn-primary" type="button">加入房間</button>
          <button id="leaveBtn" class="btn-secondary" type="button" disabled>離開房間</button>
          <button id="resetBtn" class="btn-danger" type="button" disabled>重置</button>
        </div>

        <p id="statusText" class="status-text" role="status"></p>
      </section>

      <section class="panel" aria-label="棋盤">
        <div class="board-header">
          <h2>樓層</h2>
        </div>
        <div id="board" class="board" aria-live="polite"></div>
      </section>
    </main>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script defer src="./app.js"></script>
  </body>
</html>
